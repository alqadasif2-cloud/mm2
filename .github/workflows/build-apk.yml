name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir -p release-apk
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)" release-apk/MetaTrader-5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MetaTrader-5-APK
          path: release-apk/MetaTrader-5.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MetaTrader 5 APK v1.0.${{ github.run_number }}
          files: release-apk/MetaTrader-5.apk
        continue-on-error: true
